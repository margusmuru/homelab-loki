stages:
  - test
  - deploy

include:
# loki — single stack on dev-2; bind-mounted config/, external grafana network, no secrets
  - component: $CI_SERVER_FQDN/components/docker/validate-compose@~latest
    inputs:
      as: "lint-loki"
      local_path: "deployments/loki"
  - component: $CI_SERVER_FQDN/components/docker/deploy-compose@~latest
    inputs:
      as: "deploy-loki"
      environment: "dev-2"                          # host derives to dev-2-vm.margusm.dev
      local_path: "deployments/loki"
      remote_path: "deployments/loki-dev-2-vm-1"    # unchanged host dir → in-place update
      # config/ ships with the folder (scp -r .) — no separate config-copy job needed
